<div class="register-page fade-in">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-icon">✏️</div>
      <h1 class="auth-title">Registracija</h1>
      <p class="auth-subtitle">Kreirajte nalog za brže zakazivanje</p>
    </div>

    <!-- Form -->
    <div class="auth-form">
      <div class="name-row">
        <div class="form-group">
          <label class="form-label">Ime *</label>
          <input class="input-field" [(ngModel)]="firstName" placeholder="Ime" />
        </div>
        <div class="form-group">
          <label class="form-label">Prezime</label>
          <input class="input-field" [(ngModel)]="lastName" placeholder="Prezime" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email *</label>
        <input
          class="input-field"
          type="email"
          [(ngModel)]="email"
          placeholder="email@primer.com"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Broj telefona</label>
        <input class="input-field" [(ngModel)]="phone" placeholder="063 1234567" />
      </div>

      <div class="form-group">
        <label class="form-label">Lozinka *</label>
        <div class="password-wrap">
          <input
            class="input-field"
            [type]="showPass() ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Minimum 6 karaktera"
            (keyup.enter)="register()"
          />
          <button class="pass-toggle" (click)="showPass.set(!showPass())">
            {{ showPass() ? '🙈' : '👁️' }}
          </button>
        </div>
        @if (password && password.length < 6) {
          <span class="field-error">Lozinka mora imati najmanje 6 karaktera</span>
        }
      </div>

      <button class="btn-primary auth-submit" (click)="register()" [disabled]="!canSubmit()">
        Kreirajte nalog
      </button>

      <p class="auth-switch">
        Već imate nalog?
        <a routerLink="/login" class="link-orange">Prijavite se</a>
      </p>
    </div>
  </div>
</div>
