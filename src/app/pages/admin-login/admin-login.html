<div class="admin-login-page fade-in">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="auth-icon">🛡️</div>
      <h1 class="auth-title">Admin Panel</h1>
      <p class="auth-subtitle">Pristup za berbere</p>
    </div>

    <!-- Form -->
    <div class="auth-form">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input
          class="input-field"
          type="email"
          [(ngModel)]="email"
          placeholder="admin@quattro.rs"
          (keyup.enter)="login()"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Lozinka</label>
        <div class="password-wrap">
          <input
            class="input-field"
            [type]="showPass() ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="••••••••"
            (keyup.enter)="login()"
          />
          <button class="pass-toggle" (click)="showPass.set(!showPass())">
            {{ showPass() ? '🙈' : '👁️' }}
          </button>
        </div>
      </div>

      <button
        class="btn-primary auth-submit"
        (click)="login()"
        [disabled]="!email || !password"
      >
        Ulogujte se
      </button>

      <div class="back-link">
        <a routerLink="/login">← Nazad na korisničku prijavu</a>
      </div>
    </div>
  </div>
</div>
